syntax = "proto3";

package spark;

import "spark/spark.proto";

option java_package = "me.lucko.spark.proto";
option java_outer_classname = "SparkSamplerProtos";

message SamplerData {
  SamplerMetadata metadata = 1;
  repeated ThreadNode threads = 2;
  map<string, string> class_sources = 3; // optional
  map<string, string> method_sources = 4; // optional
  map<string, string> line_sources = 5; // optional
  repeated int32 time_windows = 6;
  map<int32, WindowStatistics> time_window_statistics = 7;
  SocketChannelInfo channel_info = 8;

  // fork - additional profiling trees captured in the same recording.
  //
  // These live in a high, fenced field band ON PURPOSE. Upstream spark numbers fields
  // sequentially and is currently at 8, so anything low would eventually collide on a rebase.
  // Field numbers <= 2047 still encode as a 2-byte tag, so the cost is negligible against a
  // gzipped multi-MB profile.
  //
  // Because proto3 parsers silently ignore (and preserve) unknown fields, a profile carrying
  // these still renders correctly in the stock spark viewer - it just shows the execution
  // profile in 'threads' and never knows the rest is there. That is what lets this fork keep
  // using the standard 'application/x-spark-sampler' content type and a single share link.
  reserved 1000 to 1099; // fork reserved band - do not use for upstream merges

  // Native (off-heap) memory that was allocated and never freed, in bytes.
  repeated ThreadNode native_memory_threads = 1100;
  // Java heap objects that survived garbage collection, in bytes.
  repeated ThreadNode heap_leak_threads = 1101;
  // Which of the above trees are actually populated in this profile.
  ExtendedProfileContents extended_contents = 1102;

  // Process-level memory accounting captured at export time.
  //
  // Attached to EVERY profile this fork exports, not only memory ones, because it is the
  // context that makes a leak number interpretable. A native memory tree showing 600 KB of
  // unfreed mallocs means one thing when the process is 2 GB resident and entirely another
  // when it is 60 GB resident with 20 GB the JVM cannot account for - and the tree alone
  // cannot distinguish those. Capturing it costs a few /proc reads and some MX bean calls.
  ProcessMemoryData process_memory = 1103;
}

// fork - the kernel's and the JVM's views of this process's memory, side by side.
message ProcessMemoryData {
  int64 timestamp = 1;

  // kernel view - resident set size EXCLUDES page cache, unlike a container's memory.current
  int64 rss = 2;
  int64 swap = 3;
  map<string, int64> smaps_rollup = 4;
  map<string, int64> cgroup = 5;

  // JVM view
  int64 heap_used = 6;
  int64 heap_committed = 7;
  int64 heap_max = 8;
  int64 non_heap_committed = 9;
  map<string, int64> non_heap_pools = 10;
  int64 nio_direct_used = 11;
  int64 nio_direct_count = 12;
  int64 nio_mapped_used = 13;
  int64 netty_direct = 14;
  int64 netty_max_direct = 15;
  int32 threads = 16;
  int32 peak_threads = 17;
  int64 thread_stack_size = 18;
  int64 loaded_classes = 19;

  // rss minus everything nameable above. NOT a leak figure on its own - only its growth is.
  int64 unaccounted = 20;

  // configuration that changes how the numbers should be read
  bool always_pre_touch = 21;
  string max_direct_memory_size = 22;
  string malloc_arena_max = 23;
  int32 available_processors = 24;

  // populated only when explicitly requested - reading smaps is not free
  int32 arena_like_regions = 25;
  repeated MemoryMapping largest_mappings = 26;
  int32 total_mappings = 27;

  // Native Memory Tracking, when the JVM was started with it
  bool nmt_enabled = 28;
  string nmt_summary = 29;
}

// fork - one entry from /proc/self/smaps.
message MemoryMapping {
  int64 size = 1;
  int64 rss = 2;
  string permissions = 3;
  string path = 4;
}

// fork - describes which extra trees a profile carries, so a reader can tell
// "this mode was not enabled" apart from "this mode ran and found nothing".
// Without this the two are indistinguishable, and reporting "no leaks found" for a
// profile that never profiled memory would be actively misleading.
message ExtendedProfileContents {
  bool has_execution = 1;
  bool has_native_memory = 2;
  bool has_heap_leak = 3;
  // total bytes of unfreed native memory across all threads
  int64 native_memory_leaked_bytes = 4;
  // total bytes of retained heap across all threads
  int64 heap_leaked_bytes = 5;
  // how long the recording ran - a leak total is meaningless without it
  int64 duration_millis = 6;
  // fraction of the recording discarded as "too recent to call a leak"
  double leak_tail_ratio = 7;
  string fork_version = 8;
  // whether process-level memory accounting is attached
  bool has_process_memory = 9;
  // true when this upload carries ONLY memory accounting, with no sampled trees at all
  bool memory_accounting_only = 10;
}

message SamplerMetadata {
  CommandSenderMetadata creator = 1;
  int64 start_time = 2;
  int32 interval = 3;
  ThreadDumper thread_dumper = 4;
  DataAggregator data_aggregator = 5;
  string comment = 6;
  PlatformMetadata platform_metadata = 7;
  PlatformStatistics platform_statistics = 8;
  SystemStatistics system_statistics = 9;
  map<string, string> server_configurations = 10;
  int64 end_time = 11;
  int32 number_of_ticks = 12;
  map<string, PluginOrModMetadata> sources = 13;
  map<string, string> extra_platform_metadata = 14;
  SamplerMode sampler_mode = 15;
  SamplerEngine sampler_engine = 16;
  string sampler_engine_version = 17;
  Metrics metrics = 18;

  message ThreadDumper {
    Type type = 1;
    repeated int64 ids = 2; // optional
    repeated string patterns = 3; // optional

    enum Type {
      ALL = 0;
      SPECIFIC = 1;
      REGEX = 2;
    }
  }

  message DataAggregator {
    Type type = 1;
    ThreadGrouper thread_grouper = 2;
    int64 tick_length_threshold = 3; // optional
    int32 number_of_included_ticks = 4; // optional

    enum Type {
      SIMPLE = 0;
      TICKED = 1;
    }

    enum ThreadGrouper {
      BY_NAME = 0;
      BY_POOL = 1;
      AS_ONE = 2;
    }
  }

  enum SamplerMode {
    EXECUTION = 0;
    ALLOCATION = 1;
    // fork - high values so upstream can keep taking 2, 3, ... without colliding
    NATIVE_MEMORY = 100;
    COMBINED = 101;
  }

  enum SamplerEngine {
    JAVA = 0;
    ASYNC = 1;
  }
}

message ThreadNode {
  string name = 1;

  // replaced
  reserved 2;
  reserved "time";

  repeated StackTraceNode children = 3;
  repeated double times = 4;
  repeated int32 children_refs = 5;
}

message StackTraceNode {
  // replaced
  reserved 1, 2;
  reserved "time", "children";

  string class_name = 3;
  string method_name = 4;
  int32 parent_line_number = 5; // optional
  int32 line_number = 6; // optional
  string method_desc = 7; // optional
  repeated double times = 8;
  repeated int32 children_refs = 9;
}
