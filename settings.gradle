pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'spark'
// fork - scoped to the Bukkit/Paper family.
// The Fabric/Forge/NeoForge/Sponge modules drag in the full Minecraft modding toolchain
// (Forge's Mavenizer, mapping downloads, userdev artifacts) which is both slow and unnecessary
// for a fork targeting Paper servers. Dropping them from the build does not touch their source,
// so they can be re-enabled by restoring the lines below.
include (
        'spark-api',
        'spark-bukkit',
        'spark-common',
        'spark-geyser',
        'spark-paper',
        'spark-velocity',
)
