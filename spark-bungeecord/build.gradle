plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':spark-common')
    implementation 'net.kyori:adventure-platform-bungeecord:4.4.0'
    compileOnly('net.md-5:bungeecord-api:1.19-R0.1-SNAPSHOT') {
        exclude(module: 'bungeecord-protocol')
    }
}

processResources {
    // Declared as task inputs. Gradle does not track the values passed to expand(), so
    // processResources stays UP-TO-DATE when only the version changes - while shadowJar's
    // archiveFileName, which IS tracked, updates. An incremental build then produces a jar named
    // for the new version whose plugin descriptor still declares the old one, and spark stamps
    // that descriptor's version into every profile it exports.
    inputs.property 'pluginVersion', project.pluginVersion
    inputs.property 'pluginDescription', project.pluginDescription

    from(sourceSets.main.resources.srcDirs) {
        expand (
                'pluginVersion': project.pluginVersion,
                'pluginDescription': project.pluginDescription
        )
        include 'bungee.yml'
    }
}

shadowJar {
    archiveFileName = "spark-${project.pluginVersion}-bungeecord.jar"

    relocate 'net.kyori.adventure', 'me.lucko.spark.lib.adventure'
    relocate 'net.kyori.examination', 'me.lucko.spark.lib.adventure.examination'
    relocate 'net.kyori.option', 'me.lucko.spark.lib.adventure.option'
    relocate 'net.bytebuddy', 'me.lucko.spark.lib.bytebuddy'
    relocate 'com.google.protobuf', 'me.lucko.spark.lib.protobuf'
    relocate 'org.objectweb.asm', 'me.lucko.spark.lib.asm'
    relocate 'one.profiler', 'me.lucko.spark.lib.asyncprofiler'
    relocate 'me.lucko.bytesocks.client', 'me.lucko.spark.lib.bytesocks'
    relocate 'org.java_websocket', 'me.lucko.spark.lib.bytesocks.ws'

    project.applyExcludes(delegate)
}

artifacts {
    archives shadowJar
}
